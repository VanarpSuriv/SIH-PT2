version: "2025.1"
rules:
  # =========================================================================
  # 1. STATUTORY MANDATES (AICTE Approval Process Handbook Legal Requirements)
  # =========================================================================
  - id: "AICTE-EOA-001"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "STATUTORY_MANDATE"
    title: "Mandatory Submission of Registered Land Document / Title Deed"
    aph_reference: "AICTE Approval Process Handbook (APH) Chapter II, Clause 2.1 & Appendix 4"
    severity: "CRITICAL"
    required_document: "land_document"
    description: "Every institution applying for Extension of Approval (EoA) must furnish a legally registered Title Deed / Land Certificate issued by the Competent Revenue Authority as per statutory requirements."

  - id: "AICTE-EOA-002"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "STATUTORY_MANDATE"
    title: "Mandatory Submission of Fire and Safety Clearance Certificate (NOC)"
    aph_reference: "AICTE Approval Process Handbook (APH) Chapter II, Clause 2.3 & National Building Code Part IV"
    severity: "CRITICAL"
    required_document: "fire_noc"
    description: "Institutions must produce a valid Fire & Safety NOC issued by the Department of Fire and Emergency Services to ensure occupant and student safety under statutory norms."

  - id: "AICTE-EOA-003"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "STATUTORY_MANDATE"
    title: "Mandatory Submission of Previous Year AICTE Approval Order"
    aph_reference: "AICTE Approval Process Handbook (APH) Chapter II, Clause 2.2"
    severity: "HIGH"
    required_document: "approval_letter"
    description: "The institution must submit the prior academic cycle Extension of Approval letter to verify uninterrupted regulatory recognition and compliance continuity."

  - id: "AICTE-EOA-004"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "STATUTORY_MANDATE"
    title: "Mandatory Submission of AICTE Approved Faculty Roster"
    aph_reference: "AICTE Approval Process Handbook (APH) Chapter VII & Appendix 7 (Faculty Norms)"
    severity: "HIGH"
    required_document: "faculty_list"
    description: "The institution must submit a complete faculty roster including cadre designations, department allocations, and Principal identification in accordance with statutory staffing norms."

  - id: "AICTE-EOA-005"
    version: "2025.1"
    rule_type: "expiry"
    rule_category: "STATUTORY_MANDATE"
    title: "Fire Safety NOC Validity at Application Submission"
    aph_reference: "AICTE Approval Process Handbook (APH) Chapter II, Clause 2.3.2"
    severity: "CRITICAL"
    target_field: "fire_noc_valid_to"
    comparison_field: "application_date"
    description: "The Fire Safety Certificate (NOC) must be currently valid and not expired as of the date of application submission."

  - id: "AICTE-EOA-006"
    version: "2025.1"
    rule_type: "expiry"
    rule_category: "STATUTORY_MANDATE"
    title: "Continuity of Prior Academic Approval"
    aph_reference: "AICTE Approval Process Handbook (APH) Chapter II, Clause 2.2.1"
    severity: "HIGH"
    target_field: "approved_academic_year"
    expected_year_pattern: "2024-2025"
    description: "Prior AICTE Approval letter must correspond to the immediate previous academic cycle (2024-2025) to maintain continuous recognized standing."

  - id: "AICTE-EOA-009"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "STATUTORY_MANDATE"
    title: "Land Area Adequacy & Title Deed Reconciliation"
    aph_reference: "AICTE Approval Process Handbook (APH) Chapter IV, Clause 4.1 & Appendix 4 (Land Requirements)"
    severity: "CRITICAL"
    application_area_field: "declared_land_area"
    registered_area_field: "land_doc_area_acres"
    minimum_required_acres: 2.5
    description: "Declared campus land area must be fully supported by the registered title deed and must meet the minimum AICTE benchmark of 2.5 acres in Urban/Mega/Metro areas or 7.5 acres in Rural areas."

  # =========================================================================
  # 2. TECHNICAL CONSISTENCY CHECKS (Cross-Document Entity & Identity Resolution)
  # =========================================================================
  - id: "AICTE-EOA-007"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Institution Name Consistency across Regulatory Documents"
    aph_reference: "AICTE APH Technical Verification Standard (Clause 1.4: Entity Integrity)"
    severity: "HIGH"
    field_to_compare: "institution_name"
    similarity_threshold: 85.0
    description: "Technical consistency check: The legal name of the institution in the Application Form must match names across Land Title Deed, Fire NOC, and Approval Letter within an 85% token sort ratio to ensure proper entity attribution."

  - id: "AICTE-EOA-008"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Permanent Institute ID (PID) Consistency"
    aph_reference: "AICTE National Web Portal Submission Protocol (Clause 1.3: Unique Identifier Match)"
    severity: "CRITICAL"
    field_to_compare: "permanent_id"
    match_mode: "exact"
    description: "Technical consistency check: The Permanent Institute ID (PID) declared in the application form must be identical to the PID specified in AICTE records and previous approval orders."

  - id: "AICTE-EOA-010"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Faculty Cadre Count Consistency"
    aph_reference: "AICTE APH Technical Verification Standard (Clause 7.1: Roster Reconciliation)"
    severity: "MEDIUM"
    declared_count_field: "declared_faculty_count"
    roster_count_field: "faculty_list_count"
    match_mode: "exact"
    description: "Technical consistency check: Total teaching faculty declared in the application summary must match the exact number of faculty detailed in the submitted Faculty Roster."

  # =========================================================================
  # 3. METADATA INTEGRITY RULES (Document Lifecycle & Technical Timeline Checks)
  # Note: Metadata anomalies are flagged for manual review and DO NOT constitute proof of forgery.
  # =========================================================================
  - id: "META-001"
    version: "2025.1"
    rule_type: "metadata"
    rule_category: "METADATA_INTEGRITY"
    title: "Document Temporal Sequence Inconsistency (ModDate Precedes CreationDate)"
    aph_reference: "Technical Consistency Protocol Section 5.1 (Digital Document Integrity)"
    severity: "MEDIUM"
    description: "The PDF modification timestamp (ModDate) precedes the creation timestamp (CreationDate). This technical anomaly indicates potential clock skew, automated PDF re-assembly, or header manipulation. Flagged for officer review; this does not constitute proof of document forgery."

  - id: "META-002"
    version: "2025.1"
    rule_type: "metadata"
    rule_category: "METADATA_INTEGRITY"
    title: "Retroactive Generation Discrepancy (CreationDate Postdates Application Submission)"
    aph_reference: "Technical Consistency Protocol Section 5.2 (Filing Timeline Reconciliation)"
    severity: "MEDIUM"
    description: "The document creation timestamp (CreationDate) postdates the declared institutional application submission date by more than 24 hours. Suggests retroactive re-generation or replacement after the filing date. Flagged for officer review without implying document forgery."

  - id: "META-003"
    version: "2025.1"
    rule_type: "metadata"
    rule_category: "METADATA_INTEGRITY"
    title: "PDF Metadata Parser Syntax Warning or Header Malformation"
    aph_reference: "Technical Consistency Protocol Section 5.3 (Format Conformance)"
    severity: "LOW"
    description: "The PDF header or info dictionary produced warnings during normalization (e.g., malformed date string, missing timezone offset). Flagged for reviewer awareness without prejudice to authenticity."

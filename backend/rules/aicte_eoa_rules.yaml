version: "2025.1"
rules:
  - id: "AICTE-EOA-001"
    version: "2025.1"
    rule_type: "completeness"
    title: "Mandatory Submission of Registered Land Document / Title Deed"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 2.1"
    severity: "CRITICAL"
    required_document: "land_document"
    description: "Every institution applying for Extension of Approval (EoA) must furnish a legally registered Title Deed / Land Certificate issued by the Competent Revenue Authority."

  - id: "AICTE-EOA-002"
    version: "2025.1"
    rule_type: "completeness"
    title: "Mandatory Submission of Fire and Safety Clearance Certificate (NOC)"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 2.3"
    severity: "CRITICAL"
    required_document: "fire_noc"
    description: "Institutions must produce a valid Fire & Safety NOC issued by the Department of Fire and Emergency Services to ensure student safety."

  - id: "AICTE-EOA-003"
    version: "2025.1"
    rule_type: "completeness"
    title: "Mandatory Submission of Previous Year AICTE Approval Order"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 2.2"
    severity: "HIGH"
    required_document: "approval_letter"
    description: "The institution must submit the prior academic year Extension of Approval letter to verify uninterrupted compliance and approval continuity."

  - id: "AICTE-EOA-004"
    version: "2025.1"
    rule_type: "completeness"
    title: "Mandatory Submission of AICTE Approved Faculty Roster"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 2.5"
    severity: "HIGH"
    required_document: "faculty_list"
    description: "The institution must submit a complete faculty roster including designations, department allocations, and Principal identification."

  - id: "AICTE-EOA-005"
    version: "2025.1"
    rule_type: "expiry"
    title: "Fire Safety NOC Validity at Application Submission"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 2.3.2"
    severity: "CRITICAL"
    target_field: "fire_noc_valid_to"
    comparison_field: "application_date"
    description: "The Fire Safety Certificate (NOC) must be currently valid and not expired as of the date of application submission."

  - id: "AICTE-EOA-006"
    version: "2025.1"
    rule_type: "expiry"
    title: "Continuity of Prior Academic Approval"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 2.2.1"
    severity: "HIGH"
    target_field: "approved_academic_year"
    expected_year_pattern: "2024-2025"
    description: "Prior AICTE Approval letter must correspond to the immediate previous academic cycle (2024-2025) to maintain continuous recognized standing."

  - id: "AICTE-EOA-007"
    version: "2025.1"
    rule_type: "consistency"
    title: "Institution Name Consistency across Regulatory Documents"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 1.4"
    severity: "HIGH"
    field_to_compare: "institution_name"
    similarity_threshold: 85.0
    description: "The legal name of the institution in the Application Form must match names across Land Title Deed, Fire NOC, and Approval Letter within an 85% token sort ratio."

  - id: "AICTE-EOA-008"
    version: "2025.1"
    rule_type: "consistency"
    title: "Permanent Institute ID (PID) Consistency"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 1.3"
    severity: "CRITICAL"
    field_to_compare: "permanent_id"
    match_mode: "exact"
    description: "The Permanent Institute ID (PID) declared in the application form must be identical to the PID specified in AICTE records and previous approval orders."

  - id: "AICTE-EOA-009"
    version: "2025.1"
    rule_type: "consistency"
    title: "Land Area Adequacy & Title Deed Reconciliation"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 4.1 & Appendix 4"
    severity: "CRITICAL"
    application_area_field: "declared_land_area"
    registered_area_field: "land_doc_area_acres"
    minimum_required_acres: 2.5
    description: "Declared campus land area must be fully covered by the registered land title deed and must meet the minimum AICTE benchmark of 2.5 acres for technical institutions."

  - id: "AICTE-EOA-010"
    version: "2025.1"
    rule_type: "consistency"
    title: "Faculty Cadre Count Consistency"
    aph_reference: "AICTE Approval Process Handbook (APH) Clause 7.1"
    severity: "MEDIUM"
    declared_count_field: "declared_faculty_count"
    roster_count_field: "faculty_list_count"
    match_mode: "exact"
    description: "Total teaching faculty declared in the application summary must match the exact number of faculty detailed in the submitted Faculty Roster."

version: "2025.1"
handbook_edition: "AICTE Approval Process Handbook (APH) 2024-2027"

# =============================================================================
# 1. STATUTORY MANDATES (Official AICTE Approval Process Handbook Legal Requirements)
# Explicitly substantiated in official APH 2024-2027:
# - Chapter VI §6.17(i) & Annexure 2 §2.1(v) for Fire Safety Certificate presence & validity
# - Annexure 3 §3.1 for Land & Built-up Area Norms (conditional acreage based on programme/intake/FSI)
# Note: Routine annual online EoA does not universally mandate physical upload of registered land deeds
# or prior year AICTE approval orders (which are held in portal databases).
# =============================================================================
rules:
  - id: "AICTE-EOA-002"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "STATUTORY_MANDATE"
    title: "Mandatory Submission of Fire and Safety Clearance Certificate (NOC)"
    aph_reference: "APH 2024-2027 Chapter VI §6.17(i) (Essential Safety Norms) & Annexure 2 §2.1(v)"
    source_section: "Chapter VI §6.17(i): Fire and Safety Certificate & Annexure 2 §2.1(v)"
    page_reference: "Pages 75-78, 134-137"
    applicability_conditions: "Mandatory for all technical institutions operating physical campuses with instructional/administrative buildings. Exempt for fully online/ODL institutions without physical student facilities."
    supported_requirement: "Valid Fire and Life Safety Certificate issued by the competent Fire Services Department of the State/UT Government in accordance with National Building Code (NBC) 2016 Part 4 as mandated under Chapter VI §6.17(i) and Annexure 2 §2.1(v)."
    severity: "CRITICAL"
    required_document: "fire_noc"
    description: "Institutions operating physical campuses must submit a valid Fire & Safety Certificate issued by the competent Fire Services Department under Chapter VI §6.17(i) and Annexure 2 §2.1(v). Scope is strictly limited to certificate presence and issuing authority."

  - id: "AICTE-EOA-005"
    version: "2025.1"
    rule_type: "expiry"
    rule_category: "STATUTORY_MANDATE"
    title: "Fire Safety NOC Validity at Application Submission"
    aph_reference: "APH 2024-2027 Chapter VI §6.17(i) & Annexure 2 §2.1(v)"
    source_section: "Chapter VI §6.17(i): Essential Safety Norms & Annexure 2 §2.1(v)"
    page_reference: "Pages 75-78, 135"
    applicability_conditions: "Applies to technical institutions operating physical campus premises. Evaluates actual validity period (valid_to) certified by state/UT fire authority against application filing date."
    supported_requirement: "The Fire Safety Certificate must be in force and not expired as of the date of application submission on the AICTE portal under Chapter VI §6.17(i) and Annexure 2 §2.1(v)."
    severity: "CRITICAL"
    target_field: "fire_noc_valid_to"
    comparison_field: "application_date"
    description: "The Fire Safety Certificate must remain valid as of the date of application submission under Chapter VI §6.17(i) and Annexure 2 §2.1(v). Evaluates certified valid_to against application_date; does not invent generic expiry intervals."

  - id: "AICTE-EOA-009"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "STATUTORY_MANDATE"
    title: "Land Area Adequacy per Programme & Intake Norms"
    aph_reference: "APH 2024-2027 Annexure 3 §3.1 (Norms for Land & Built-up Area Requirements)"
    source_section: "Annexure 3 §3.1: Table 3.1 & Table 3.2 (Land & Area Requirements)"
    page_reference: "Pages 82-89"
    applicability_conditions: "Applies conditionally based on approved intake, course duration, applicable FSI/FAR norms, and location classification (Mega/Metro, Urban, Rural) per Annexure 3 §3.1."
    supported_requirement: "Conditional land-norm verification: Declared campus land area must meet conditional acreage requirements prescribed in Annexure 3 §3.1 for the institution's specific programme and intake, supported by submitted land documentation."
    severity: "CRITICAL"
    application_area_field: "declared_land_area"
    registered_area_field: "land_doc_area_acres"
    minimum_required_acres: 2.5
    description: "Campus land area must satisfy conditional acreage and built-up area norms under Annexure 3 §3.1 based on intake and location. Area shortfalls represent capacity/norm deficits and do not automatically indicate a defective legal title."

  # =============================================================================
  # 2. TECHNICAL CONSISTENCY CHECKS (Application Hygiene, Reconciliation & Entity Resolution)
  # Automated verification integrity checks across disparate records and supporting uploads.
  # Note: These are technical consistency rules, not statutory mandates.
  # =============================================================================
  - id: "AICTE-EOA-006"
    version: "2025.1"
    rule_type: "expiry"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Prior Academic Approval Year Continuity Reconciliation"
    aph_reference: "Technical Application Verification Protocol (AICTE Central Record Reconciliation)"
    source_section: "VERITAS Verification Architecture: Approval Order Reconciliation (Chapter II §2.1 Context)"
    page_reference: "Pages 32-34 (Chapter II Context)"
    applicability_conditions: "Evaluated when an applicant uploads previous approval documentation for automated continuity reconciliation."
    supported_requirement: "Reconciliation of uploaded prior-year approval letter against immediate previous academic cycle (2024-2025) to verify documentation continuity. In routine annual online EoA, prior approvals are maintained internally within the AICTE portal database; physical upload reconciliation is an advisory consistency check."
    severity: "HIGH"
    target_field: "approved_academic_year"
    expected_year_pattern: "2024-2025"
    description: "Reconciles uploaded prior-year approval letter against immediate previous academic cycle (2024-2025) to verify documentation continuity."
  - id: "AICTE-EOA-001"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Land Document Submission Reconciliation"
    aph_reference: "Technical Supporting Document Verification (Chapter II Periodic Scrutiny / Expansion)"
    source_section: "VERITAS Application Verification Protocol (cross-ref. Annexure 3 §3.1)"
    page_reference: "Pages 82-89 (Annexure 3 §3.1 Context)"
    applicability_conditions: "Mandatory during initial establishment (Chapter I), change of site, expansion, or periodic scrutiny. In routine annual online EoA, land ownership is affirmed via portal self-disclosure."
    supported_requirement: "Reconciliation of applicant self-disclosure against uploaded registered title deed or lease certificate when requested during scrutiny."
    severity: "HIGH"
    required_document: "land_document"
    description: "Technical consistency check: Verifies the presence of supporting land title deed or lease documentation when comprehensive scrutiny or expansion verification is conducted."

  - id: "AICTE-EOA-003"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Prior Approval Document Submission Reconciliation"
    aph_reference: "Technical Application Verification Protocol (AICTE Central Record Reconciliation)"
    source_section: "VERITAS Verification Architecture: Approval Order Reconciliation"
    page_reference: "Pages 32-34 (Chapter II Context)"
    applicability_conditions: "Evaluated when an applicant uploads previous approval documentation for automated continuity reconciliation."
    supported_requirement: "Verification of uploaded previous approval order against internal portal application records to confirm institutional standing."
    severity: "HIGH"
    required_document: "approval_letter"
    description: "Technical consistency check: Reconciles uploaded prior-year approval letter against institutional application identity to ensure document continuity."

  - id: "AICTE-EOA-004"
    version: "2025.1"
    rule_type: "completeness"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Faculty Cadre Roster Submission Reconciliation"
    aph_reference: "Technical Application Supporting Document Protocol (Faculty Cadre Structure)"
    source_section: "VERITAS Verification Architecture: Faculty Cadre Reconciliation"
    page_reference: "N/A (Technical Consistency Check)"
    applicability_conditions: "Evaluated when an institution uploads a supporting faculty roster PDF alongside portal self-disclosure."
    supported_requirement: "Reconciliation of uploaded faculty cadre roster details (designations, departments, Principal) with institutional staff norms."
    severity: "HIGH"
    required_document: "faculty_list"
    description: "Technical consistency check: Verifies submission and structure of supporting faculty roster PDF to confirm cadre designations and departmental assignments."

  - id: "AICTE-EOA-007"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Institution Name Consistency across Regulatory Documents"
    aph_reference: "Technical Verification Standard (Automated Entity Resolution Protocol)"
    source_section: "VERITAS Verification Architecture: Entity Resolution Standard"
    page_reference: "N/A (Technical Consistency Check)"
    applicability_conditions: "Evaluated across all submitted documents where institution legal entity name appears."
    supported_requirement: "Cross-document reconciliation of applicant name using RapidFuzz token sort matching (85% threshold) to detect clerical divergence or unauthorized branch references."
    severity: "HIGH"
    field_to_compare: "institution_name"
    similarity_threshold: 85.0
    description: "Technical consistency check: Legal name of the institution in the Application Form must match names across Land Document, Fire NOC, and Approval Letter within an 85% token sort ratio."

  - id: "AICTE-EOA-008"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Permanent Institute ID (PID) Consistency"
    aph_reference: "Technical Verification Standard (AICTE National Portal Unique Identifier Matching)"
    source_section: "VERITAS Verification Architecture: National Portal Unique ID Protocol"
    page_reference: "N/A (Technical Consistency Check)"
    applicability_conditions: "Applies to all existing institutions assigned a permanent 1-XXXXXXXXX portal identifier."
    supported_requirement: "Exact match of the unique portal PID across submitted application forms and regulatory approval orders to prevent cross-institution document conflation."
    severity: "CRITICAL"
    field_to_compare: "permanent_id"
    match_mode: "exact"
    description: "Technical consistency check: Permanent Institute ID (PID) declared in application must match AICTE records and previous approval orders."

  - id: "AICTE-EOA-010"
    version: "2025.1"
    rule_type: "consistency"
    rule_category: "TECHNICAL_CONSISTENCY"
    title: "Faculty Cadre Count Consistency"
    aph_reference: "Technical Verification Standard (Portal Self-Disclosure vs. Roster Reconciliation)"
    source_section: "VERITAS Verification Architecture: Roster Data Reconciliation"
    page_reference: "N/A (Technical Consistency Check)"
    applicability_conditions: "Evaluated when both application form summary count and detailed faculty roster are available."
    supported_requirement: "Declared teaching faculty count in portal self-disclosure must reconcile with the itemized roster count."
    severity: "MEDIUM"
    declared_count_field: "declared_faculty_count"
    roster_count_field: "faculty_list_count"
    match_mode: "exact"
    description: "Technical consistency check: Total teaching faculty declared in the application summary must match the exact number of faculty detailed in the submitted Faculty Roster."

  # =============================================================================
  # 3. METADATA INTEGRITY RULES (Document Lifecycle & Technical Timeline Checks)
  # Note: Metadata anomalies are flagged for technical review and DO NOT constitute proof of forgery.
  # Absence of metadata or standard generator tools is benign and not grounds for rejection.
  # =============================================================================
  - id: "META-001"
    version: "2025.1"
    rule_type: "metadata"
    rule_category: "METADATA_INTEGRITY"
    title: "Document Temporal Sequence Inconsistency (ModDate Precedes CreationDate)"
    aph_reference: "Technical Metadata Quality & Forensic Timestamp Standard"
    source_section: "ISO 32000-1 / PDF 1.7 Specification Section 14.3.3"
    page_reference: "ISO 32000-1 Page 558"
    applicability_conditions: "Evaluated only when both CreationDate and ModDate are present in PDF info dictionary. Stripped or missing metadata is benign and ignored."
    supported_requirement: "Technical sequence integrity: PDF modification timestamp should not precede creation timestamp by more than 1 hour (allowing for clock jitter)."
    severity: "MEDIUM"
    description: "Flags documents where PDF ModDate strictly precedes CreationDate by more than 1 hour. This anomaly triggers technical inspection but does not constitute proof of document forgery."

  - id: "META-002"
    version: "2025.1"
    rule_type: "metadata"
    rule_category: "METADATA_INTEGRITY"
    title: "Document Creation Timestamp Postdates Filing Date"
    aph_reference: "Technical Timeline Reconciliation Standard"
    source_section: "VERITAS Verification Architecture: Filing Timestamp Validation"
    page_reference: "N/A (Technical Consistency Check)"
    applicability_conditions: "Evaluated only when valid normalized CreationDate exists and application submission date is known. Missing metadata is benign."
    supported_requirement: "Temporal consistency: Document creation date should not postdate the official application submission date by more than 24 hours."
    severity: "MEDIUM"
    description: "Flags documents whose internal creation date postdates the declared application filing date by more than 24 hours. Indicates possible retroactive document generation or replacement; flagged for officer review."

  - id: "META-003"
    version: "2025.1"
    rule_type: "metadata"
    rule_category: "METADATA_INTEGRITY"
    title: "Metadata Syntax and Normalization Warning Flag"
    aph_reference: "PDF Parser Compliance Standard (ASN.1 Date Syntax)"
    source_section: "ISO 32000-1 Section 7.9.4 (Dates)"
    page_reference: "ISO 32000-1 Page 30"
    applicability_conditions: "Evaluated during PDF metadata parsing when non-standard syntax (such as missing timezone offset) is encountered."
    supported_requirement: "Syntactic validity: Document metadata complies with standard PDF date formatting conventions."
    severity: "LOW"
    description: "Flags non-standard date syntax or formatting warnings encountered during parsing (e.g. missing timezone indicator). Flags for informational review; does not imply tampering."

  # =============================================================================
  # 4. FORENSIC ADVISORY RULES (Computer Vision, Steganalysis & Clone Detection)
  # Automated image forensics signals. Strictly advisory for human officer review;
  # does NOT independently establish forgery, fraud, or statutory non-compliance.
  # =============================================================================
  - id: "FOR-001"
    version: "2025.1"
    rule_type: "forensics"
    rule_category: "FORENSIC_ADVISORY"
    title: "Copy-Move Duplicate Region Detected (Seal/Signature Clones)"
    aph_reference: "VERITAS Forensic Architecture: SIFT-FLANN-RANSAC Self-Similarity Check"
    source_section: "SIFT Keypoint Matching & RANSAC Affine Inlier Verification"
    page_reference: "N/A (Computer Vision Advisory)"
    applicability_conditions: "Evaluated across rendered document pages with sufficient keypoints (>100)."
    supported_requirement: "Self-similarity verification: Evaluates duplicate image regions (such as copied stamps, seals, or signatures) using scale-invariant feature transform and geometric consistency."
    severity: "HIGH"
    description: "Flags identical or geometrically matched duplicated regions on the same page. Suggests cloned seals or copied signatures for officer verification."

  - id: "FOR-002"
    version: "2025.1"
    rule_type: "forensics"
    rule_category: "FORENSIC_ADVISORY"
    title: "Error Level Analysis (ELA) Compression Inconsistency"
    aph_reference: "VERITAS Forensic Architecture: Fixed-Quality JPEG Resynthesis"
    source_section: "Error Level Analysis (Krawetz 2007) with Baseline Normalization"
    page_reference: "N/A (Computer Vision Advisory)"
    applicability_conditions: "Evaluated on all rendered page bitmaps at 90% re-encode quality."
    supported_requirement: "Compression consistency: Identifies localized differences in compression history across different document regions."
    severity: "MEDIUM"
    description: "Flags localized compression discrepancies indicating spliced or digitally altered elements against a recompressed baseline."

  - id: "FOR-003"
    version: "2025.1"
    rule_type: "forensics"
    rule_category: "FORENSIC_ADVISORY"
    title: "Typographical Style Outlier Detected (Stroke/Height Anomaly)"
    aph_reference: "VERITAS Forensic Architecture: Otsu Distance Transform Font Consistency"
    source_section: "Attribution Font Stroke & Height Outlier Detection"
    page_reference: "N/A (Computer Vision Advisory)"
    applicability_conditions: "Evaluated on short text tokens outside header letterhead zones."
    supported_requirement: "Typographic consistency: Token stroke width and height should match dominant body-text style."
    severity: "MEDIUM"
    description: "Flags values whose stroke width or character height deviates by >30% from the document's body-text norm, indicating retyped or overlaid values."

  - id: "FOR-004"
    version: "2025.1"
    rule_type: "forensics"
    rule_category: "FORENSIC_ADVISORY"
    title: "Document Scan Quality Gating (Blur or Glare Warning)"
    aph_reference: "VERITAS Ingestion Quality Protocol (Laplacian & HSV Glare Check)"
    source_section: "Image Quality Assurance"
    page_reference: "N/A (Technical Consistency Check)"
    applicability_conditions: "Evaluated on all uploaded document pages."
    supported_requirement: "Legibility assurance: Uploaded scans must satisfy minimum sharpness and contrast norms."
    severity: "LOW"
    description: "Advises when an uploaded scan exhibits high blur or excessive glare that could impair visual legibility."

  - id: "FOR-005"
    version: "2025.1"
    rule_type: "forensics"
    rule_category: "FORENSIC_ADVISORY"
    title: "Document QR Code Domain Verification"
    aph_reference: "VERITAS Verification Architecture: Offline 2D Barcode Resolver"
    source_section: "QR Code Extraction & SSRF-Safe Domain Matching"
    page_reference: "N/A (Technical Consistency Check)"
    applicability_conditions: "Evaluated when an approval letter or certificate contains a 2D QR barcode."
    supported_requirement: "Regulatory link integrity: Embedded URLs must resolve to official government or AICTE domains without SSRF risk."
    severity: "MEDIUM"
    description: "Verifies embedded 2D QR barcodes against the official AICTE/Government domain whitelist and blocks loopback or private IP addresses."

